<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rania Ababssi | Elevator Pitch</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: "DM Sans", sans-serif;

            background: #f7f5f0;

            color: #252525;

            line-height: 1.6;

            min-height: 100vh;

            display: flex;

            flex-direction: column;
        }



        /* =========================================
           NAVIGATION
        ========================================= */

        .navbar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 78px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background: rgba(247, 245, 240, 0.95);

            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(0, 0, 0, 0.08);

            z-index: 1000;
        }


        .logo {

            font-family: "Playfair Display", serif;

            font-size: 25px;

            font-weight: 600;

            letter-spacing: 1px;

            color: #252525;

            text-decoration: none;
        }


        .nav-links {

            display: flex;

            gap: 40px;

            list-style: none;
        }


        .nav-links a {

            position: relative;

            text-decoration: none;

            color: #333;

            font-size: 14px;

            font-weight: 500;

            letter-spacing: 1px;

            text-transform: uppercase;

            transition: 0.3s ease;
        }


        .nav-links a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 1px;

            background: #8b7355;

            transition: 0.3s ease;
        }


        .nav-links a:hover::after,
        .nav-links a.active::after {

            width: 100%;
        }


        .nav-links a:hover,
        .nav-links a.active {

            color: #8b7355;
        }



        /* =========================================
           MAIN
        ========================================= */

        main {

            flex: 1;

            padding-top: 78px;

            display: flex;

            flex-direction: column;
        }



        /* =========================================
           ELEVATOR PITCH HERO
        ========================================= */

        .pitch-page {

            min-height: calc(100vh - 78px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 70px 7% 90px;

            position: relative;

            overflow: hidden;
        }


        /* Large background text */

        .pitch-page::before {

            content: "PITCH";

            position: absolute;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            font-family: "Playfair Display", serif;

            font-size: clamp(120px, 20vw, 300px);

            color: rgba(139, 115, 85, 0.035);

            white-space: nowrap;

            pointer-events: none;

            user-select: none;
        }


        .pitch-container {

            width: 100%;

            max-width: 1200px;

            position: relative;

            z-index: 2;

            text-align: center;
        }


        .section-label {

            color: #8b7355;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 5px;

            text-transform: uppercase;

            margin-bottom: 18px;
        }


        .pitch-title {

            font-family: "Playfair Display", serif;

            font-size: clamp(48px, 6vw, 75px);

            font-weight: 500;

            line-height: 1;

            margin-bottom: 15px;
        }


        .pitch-title span {

            color: #8b7355;
        }


        .pitch-subtitle {

            color: #777;

            font-size: 16px;

            margin-bottom: 45px;
        }



        /* =========================================
           VIDEO
        ========================================= */

        .video-frame {

            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            position: relative;

            background: #202020;

            padding: 10px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.16);

        }


        .video-frame::before {

            content: "";

            position: absolute;

            top: 20px;
            left: 20px;

            width: 45px;
            height: 45px;

            border-top: 1px solid #b59a76;

            border-left: 1px solid #b59a76;

            z-index: 3;

            pointer-events: none;
        }


        .video-frame::after {

            content: "";

            position: absolute;

            bottom: 20px;
            right: 20px;

            width: 45px;
            height: 45px;

            border-bottom: 1px solid #b59a76;

            border-right: 1px solid #b59a76;

            z-index: 3;

            pointer-events: none;
        }


        video {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: contain;

            background: #111;
        }



        /* =========================================
           BOTTOM TEXT
        ========================================= */

        .video-caption {

            margin-top: 30px;

            color: #777;

            font-size: 14px;

            letter-spacing: 0.5px;
        }



        /* =========================================
           FOOTER
        ========================================= */

        footer {

            padding: 30px 9%;

            background: #252525;

            color: #aaa;

            text-align: center;

            font-size: 13px;
        }



        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 850px) {

            .navbar {

                padding: 0 5%;
            }


            .nav-links {

                gap: 15px;
            }


            .nav-links a {

                font-size: 11px;
            }


            .pitch-page {

                padding-left: 5%;

                padding-right: 5%;
            }


            .video-frame {

                padding: 7px;
            }

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .logo {

                font-size: 18px;
            }


            .nav-links {

                gap: 10px;
            }


            .nav-links a {

                font-size: 9px;
            }


            .pitch-page {

                padding-top: 50px;

                padding-bottom: 60px;
            }


            .pitch-title {

                font-size: 48px;
            }


            .pitch-subtitle {

                font-size: 14px;

                margin-bottom: 30px;
            }


            .video-frame {

                padding: 4px;
            }


            .video-frame::before {

                top: 10px;
                left: 10px;

                width: 25px;
                height: 25px;
            }


            .video-frame::after {

                bottom: 10px;
                right: 10px;

                width: 25px;
                height: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="navbar">

        <a href="bio.html" class="logo">
            RANIA ABABSSI
        </a>


        <nav>

            <ul class="nav-links">

                <li>
                    <a href="bio.html">
                        Bio
                    </a>
                </li>


                <li>
                    <a href="elevator-pitch.html" class="active">
                        Elevator Pitch
                    </a>
                </li>


                <li>
                    <a href="portfolio.html">
                        Portfolio
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>


        <section class="pitch-page">

            <div class="pitch-container">


                <div class="section-label">
                    02 — Presentation
                </div>


                <h1 class="pitch-title">
                    Elevator <span>Pitch</span>
                </h1>


                <p class="pitch-subtitle">
                    Get to know Rania beyond the portfolio.
                </p>


                <!-- VIDEO -->

                <div class="video-frame">

                    <video controls preload="metadata">

                        <source
                            src="ElevatorPitch.mp4"
                            type="video/mp4"
                        >

                        Your browser does not support
                        the video element.

                    </video>

                </div>


                <p class="video-caption">
                    A brief introduction to Rania's journey,
                    perspective, and professional aspirations.
                </p>


            </div>

        </section>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        © 2026 Rania Ababssi — Architecture Portfolio

    </footer>


</body>

</html>
